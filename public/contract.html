<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Contract — CrewMind</title>
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f1f5f9; color: #0f172a; margin: 0; padding: 20px; }
    .wrap { max-width: 860px; margin: 0 auto; }
    h1 { font-size: 22px; margin-bottom: 4px; }
    .sub { color: #475569; margin-top: 0; }
    .card { background: #fff; border: 1px solid #cbd5e1; border-radius: 10px; padding: 20px; margin-bottom: 18px; }
    iframe { width: 100%; height: 640px; border: 1px solid #cbd5e1; border-radius: 8px; background: #fff; }
    input[type="text"] { width: 100%; box-sizing: border-box; padding: 12px; font-size: 16px; border: 1px solid #94a3b8; border-radius: 6px; margin: 8px 0 14px; }
    label.agree { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; margin-bottom: 16px; }
    label.agree input { margin-top: 3px; transform: scale(1.25); }
    button { background: #0284c7; color: #fff; border: none; padding: 13px 26px; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
    button:disabled { background: #94a3b8; cursor: wait; }
    .banner { border-radius: 8px; padding: 14px 18px; margin-bottom: 18px; font-size: 15px; }
    .green { background: #dcfce7; border: 1px solid #22c55e; }
    .amber { background: #fef9c3; border: 1px solid #eab308; }
    .red { background: #fee2e2; border: 1px solid #ef4444; }
    .msg { font-size: 14px; margin-top: 10px; }
    .err { color: #b91c1c; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1 id="title">Your Service Agreement</h1>
    <p class="sub" id="subtitle">Loading your contract…</p>

    <div id="banner"></div>

    <div class="card" style="padding:10px;">
      <iframe id="docFrame" title="Contract document"></iframe>
    </div>

    <div class="card" id="signCard" style="display:none;">
      <h2 style="margin-top:0;">Sign this contract</h2>
      <p>By typing your full legal name and clicking Sign, you agree to the terms above. Your typed name is your electronic signature under the ESIGN Act and the Texas Uniform Electronic Transactions Act.</p>
      <label for="signName">Full legal name</label>
      <input type="text" id="signName" autocomplete="name" placeholder="e.g. Jane Q. Homeowner">
      <label class="agree">
        <input type="checkbox" id="agreeBox">
        <span>I have read and agree to the scope of work, price, and terms in this contract, and I agree to sign electronically.</span>
      </label>
      <button id="signBtn" onclick="signContract()">Sign contract</button>
      <p class="msg" id="signMsg"></p>
    </div>
  </div>

  <script>
    const token = new URLSearchParams(window.location.search).get('c');

    function banner(html, cls) {
      document.getElementById('banner').innerHTML = html ? `<div class="banner ${cls}">${html}</div>` : '';
    }

    async function load() {
      if (!token) {
        document.getElementById('subtitle').textContent = 'This link is missing its access token.';
        banner('This contract link is incomplete. Please use the exact link from your email.', 'red');
        return;
      }
      document.getElementById('docFrame').src = '/api/contracts/document/' + encodeURIComponent(token);

      try {
        const res = await fetch('/api/contracts/view/' + encodeURIComponent(token));
        if (!res.ok) throw new Error('not found');
        const { contract } = await res.json();
        document.getElementById('title').textContent = contract.title || 'Your Service Agreement';
        document.getElementById('subtitle').textContent =
          `Contract ${contract.contract_number} · Total $${(contract.total_cents / 100).toFixed(2)} · Deposit $${(contract.deposit_cents / 100).toFixed(2)}`;

        if (contract.status === 'signed') {
          banner(`<strong>Signed</strong> by ${contract.signed_name} on ${new Date(contract.signed_at).toLocaleString('en-US')}. This contract is complete — a copy of the signed document is shown below.`, 'green');
        } else if (contract.status === 'sent') {
          banner('Please review the full contract below, then sign at the bottom of this page.', 'amber');
          document.getElementById('signCard').style.display = 'block';
          if (contract.customer_name) document.getElementById('signName').value = contract.customer_name;
        } else if (contract.status === 'void') {
          banner('This contract has been voided by the contractor and is no longer valid.', 'red');
        } else {
          banner('This contract is still being prepared by your contractor. You will get an email when it is ready to sign.', 'amber');
        }
      } catch (e) {
        document.getElementById('subtitle').textContent = 'Contract not found.';
        banner('We could not find this contract. Please use the exact link from your email, or contact your contractor.', 'red');
      }
    }

    async function signContract() {
      const name = document.getElementById('signName').value.trim();
      const agree = document.getElementById('agreeBox').checked;
      const msg = document.getElementById('signMsg');
      if (name.length < 2) { msg.textContent = 'Please type your full legal name.'; msg.className = 'msg err'; return; }
      if (!agree) { msg.textContent = 'Please check the "I agree" box to sign.'; msg.className = 'msg err'; return; }

      const btn = document.getElementById('signBtn');
      btn.disabled = true;
      msg.textContent = '';
      try {
        const res = await fetch('/api/contracts/view/' + encodeURIComponent(token) + '/sign', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ signed_name: name, agree: true }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'Signing failed.');
        document.getElementById('signCard').style.display = 'none';
        banner(`<strong>Thank you — your contract is signed.</strong> Signed by ${data.contract.signed_name} on ${new Date(data.contract.signed_at).toLocaleString('en-US')}. The signed document below now includes your signature record.`, 'green');
        // Reload the document so it shows the completed signature block.
        document.getElementById('docFrame').src = '/api/contracts/document/' + encodeURIComponent(token) + '?signed=1';
      } catch (e) {
        msg.textContent = e.message;
        msg.className = 'msg err';
        btn.disabled = false;
      }
    }

    load();
  </script>
</body>
</html>
