<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment received</title>
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<style>
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:#0f1115; color:#e8eaed; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card { background:#171a21; border:1px solid #262b36; border-radius:14px; padding:36px; max-width:440px; text-align:center; }
  h1 { font-size:24px; margin-bottom:10px; }
  p { color:#9aa3b2; line-height:1.6; }
</style>
</head>
<body>
  <div class="card">
    <h1 id="title">✅ Payment received</h1>
    <p id="body">Thank you! Your payment is being processed and a receipt will follow by email. You can close this page.</p>
  </div>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get('cancelled')) {
    document.getElementById('title').textContent = 'Payment not completed';
    document.getElementById('body').textContent = 'No charge was made. You can use the pay link in your invoice email whenever you are ready.';
  }
</script>
</body>
</html>
