<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot your password — CrewMind</title>
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1A1D20">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CrewMind">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:#0f1115; color:#e8eaed; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card { background:#171a21; border:1px solid #262b36; border-radius:14px; padding:36px; width:100%; max-width:440px; }
  h1 { font-size:26px; margin-bottom:6px; }
  .sub { color:#9aa3b2; margin-bottom:24px; font-size:15px; line-height:1.5; }
  label { display:block; font-size:13px; font-weight:600; color:#c6cdd8; margin:16px 0 6px; }
  input { width:100%; padding:11px 13px; border-radius:8px; border:1px solid #333a47; background:#10131a; color:#e8eaed; font-size:15px; }
  input:focus { outline:none; border-color:#ffb347; }
  button { width:100%; margin-top:26px; padding:13px; border:none; border-radius:9px; background:#ffb347; color:#1a1206; font-size:16px; font-weight:700; cursor:pointer; }
  button:hover { background:#ffc06b; }
  button:disabled { opacity:.55; cursor:wait; }
  .ok { display:none; margin-top:16px; background:#14301c; border:1px solid #2e7a44; color:#a9e8bc; padding:11px 13px; border-radius:8px; font-size:14px; line-height:1.5; }
  .fine { margin-top:18px; color:#7d8593; font-size:13px; text-align:center; line-height:1.5; }
  a { color:#ffb347; }
</style>
</head>
<body>
  <div class="card">
    <h1>Forgot your password?</h1>
    <p class="sub">Enter the email you use for CrewMind and we'll send you a link to reset your password. The link expires in 1 hour.</p>
    <form id="forgotForm">
      <label for="email">Email</label>
      <input id="email" type="email" required autocomplete="email" placeholder="you@yourbusiness.com">
      <div class="ok" id="ok"></div>
      <button type="submit" id="submitBtn">Send reset link</button>
    </form>
    <p class="fine">Remembered it after all? <a href="/app">Back to log in</a></p>
  </div>
<script>
  document.getElementById('forgotForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const ok = document.getElementById('ok');
    btn.disabled = true; btn.textContent = 'Sending…';
    try {
      // The server always answers with the same generic message, whether
      // or not the email has an account — so we always show it.
      const res = await fetch('/api/auth/forgot-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: document.getElementById('email').value }),
      });
      const data = await res.json().catch(() => ({}));
      ok.textContent = data.message || 'If an account exists for that email, a reset link is on its way.';
    } catch (ex) {
      ok.textContent = 'If an account exists for that email, a reset link is on its way.';
    }
    ok.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Send reset link';
  });
</script>
</body>
</html>
