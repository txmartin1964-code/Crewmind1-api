<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Get a quote — {{BUSINESS_NAME}}</title>
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:#0f1115; color:#e8eaed; min-height:100vh; display:flex; align-items:flex-start; justify-content:center; padding:28px 16px; }
  .card { background:#171a21; border:1px solid #262b36; border-radius:14px; padding:32px; width:100%; max-width:560px; }
  h1 { font-size:24px; margin-bottom:6px; }
  .sub { color:#9aa3b2; margin-bottom:20px; line-height:1.5; font-size:15px; }
  label { display:block; font-size:13px; font-weight:600; color:#c6cdd8; margin:14px 0 6px; }
  input, select, textarea { width:100%; padding:11px 13px; border-radius:8px; border:1px solid #333a47; background:#10131a; color:#e8eaed; font-size:15px; font-family:inherit; }
  input:focus, select:focus, textarea:focus { outline:none; border-color:#ffb347; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  button { width:100%; margin-top:24px; padding:13px; border:none; border-radius:9px; background:#ffb347; color:#1a1206; font-size:16px; font-weight:700; cursor:pointer; }
  button:disabled { opacity:.55; cursor:wait; }
  .msg { display:none; margin-top:16px; padding:12px 14px; border-radius:8px; font-size:14px; line-height:1.5; }
  .msg.err { background:#3a1d24; border:1px solid #7a2e3d; color:#ffb3c0; }
  .msg.ok { background:#14301c; border:1px solid #2e7a44; color:#a9e8bc; }
</style>
</head>
<body>
  <div class="card">
    <h1>Get a fast quote from {{BUSINESS_NAME}}</h1>
    <p class="sub">Tell us about the job. You'll get an instant ballpark estimate by email, and you can book a visit right away.</p>
    <form id="quoteForm">
      <label for="name">Your name *</label>
      <input id="name" required autocomplete="name">
      <div class="row">
        <div>
          <label for="email">Email *</label>
          <input id="email" type="email" required autocomplete="email">
        </div>
        <div>
          <label for="phone">Phone</label>
          <input id="phone" type="tel" autocomplete="tel">
        </div>
      </div>
      <label for="job_type">What do you need? *</label>
      <select id="job_type" required>
        <option value="roof_repair">Roof repair</option>
        <option value="roof_replacement">Roof replacement</option>
        <option value="gutter_install">Gutter install</option>
        <option value="plumbing_repair">Plumbing repair</option>
        <option value="water_heater">Water heater</option>
        <option value="hvac_repair">HVAC repair</option>
        <option value="hvac_install">HVAC install</option>
        <option value="electrical">Electrical work</option>
        <option value="concrete">Concrete work</option>
        <option value="drywall">Drywall</option>
        <option value="painting">Painting</option>
        <option value="flooring_install">Flooring installation</option>
        <option value="other">Something else</option>
      </select>
      <label for="address">Property address *</label>
      <input id="address" required autocomplete="street-address">
      <div class="row">
        <div>
          <label for="city">City</label>
          <input id="city" autocomplete="address-level2">
        </div>
        <div>
          <label for="zip">ZIP</label>
          <input id="zip" autocomplete="postal-code">
        </div>
      </div>
      <div class="row">
        <div>
          <label for="sqft">Approx. size (sq ft)</label>
          <input id="sqft" type="number" min="0" placeholder="e.g. 1200">
        </div>
        <div>
          <label for="timeline">Timeline</label>
          <select id="timeline">
            <option value="asap">As soon as possible</option>
            <option value="this_week">This week</option>
            <option value="this_month">This month</option>
            <option value="flexible">Flexible / just pricing</option>
          </select>
        </div>
      </div>
      <label for="description">Describe the job</label>
      <textarea id="description" rows="4" placeholder="What's going on? Any details help us price it right."></textarea>
      <div class="msg err" id="err"></div>
      <div class="msg ok" id="ok"></div>
      <button type="submit" id="submitBtn">Get my quote</button>
    </form>
  </div>
<script>
  const slug = location.pathname.split('/').filter(Boolean).pop();
  document.getElementById('quoteForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const err = document.getElementById('err');
    const ok = document.getElementById('ok');
    err.style.display = 'none'; ok.style.display = 'none';
    btn.disabled = true; btn.textContent = 'Sending…';
    const val = (id) => document.getElementById(id).value.trim();
    try {
      const res = await fetch('/api/leads', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          tenant_slug: slug,
          name: val('name'), email: val('email'), phone: val('phone'),
          job_type: val('job_type'), address: val('address'), city: val('city'),
          zip: val('zip'), sqft: val('sqft') ? parseInt(val('sqft'), 10) : undefined,
          timeline: val('timeline'), description: val('description'),
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Something went wrong.');
      ok.textContent = 'Request received! Your estimate is on its way to ' + val('email') + ' — check your inbox in a minute or two.';
      ok.style.display = 'block';
      btn.textContent = 'Request sent ✓';
      e.target.querySelectorAll('input,select,textarea').forEach(el => el.disabled = true);
    } catch (ex) {
      err.textContent = ex.message;
      err.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Get my quote';
    }
  });
</script>
</body>
</html>
