<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset your password — CrewMind</title>
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1A1D20">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CrewMind">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:#0f1115; color:#e8eaed; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card { background:#171a21; border:1px solid #262b36; border-radius:14px; padding:36px; width:100%; max-width:440px; }
  h1 { font-size:26px; margin-bottom:6px; }
  .sub { color:#9aa3b2; margin-bottom:24px; font-size:15px; line-height:1.5; }
  label { display:block; font-size:13px; font-weight:600; color:#c6cdd8; margin:16px 0 6px; }
  input { width:100%; padding:11px 13px; border-radius:8px; border:1px solid #333a47; background:#10131a; color:#e8eaed; font-size:15px; }
  input:focus { outline:none; border-color:#ffb347; }
  button { width:100%; margin-top:26px; padding:13px; border:none; border-radius:9px; background:#ffb347; color:#1a1206; font-size:16px; font-weight:700; cursor:pointer; }
  button:hover { background:#ffc06b; }
  button:disabled { opacity:.55; cursor:wait; }
  .err { display:none; margin-top:16px; background:#3a1d24; border:1px solid #7a2e3d; color:#ffb3c0; padding:11px 13px; border-radius:8px; font-size:14px; line-height:1.5; }
  .ok { display:none; margin-top:16px; background:#14301c; border:1px solid #2e7a44; color:#a9e8bc; padding:11px 13px; border-radius:8px; font-size:14px; line-height:1.5; }
  .fine { margin-top:18px; color:#7d8593; font-size:13px; text-align:center; line-height:1.5; }
  a { color:#ffb347; }
</style>
</head>
<body>
  <div class="card">
    <h1>Reset your password</h1>
    <p class="sub">Choose a new password for your CrewMind account.</p>
    <form id="resetForm">
      <label for="password">New password (8+ characters)</label>
      <input id="password" type="password" required minlength="8" autocomplete="new-password">
      <label for="confirm">Confirm new password</label>
      <input id="confirm" type="password" required minlength="8" autocomplete="new-password">
      <div class="err" id="err"></div>
      <div class="ok" id="ok"></div>
      <button type="submit" id="submitBtn">Set new password</button>
    </form>
    <p class="fine"><a href="/app">Back to log in</a> · <a href="/forgot-password.html">Request a new reset link</a></p>
  </div>
<script>
  const token = new URLSearchParams(location.search).get('token') || '';
  const err = document.getElementById('err');
  const ok = document.getElementById('ok');
  const form = document.getElementById('resetForm');
  const btn = document.getElementById('submitBtn');

  function showErr(msg) {
    err.textContent = msg;
    err.style.display = 'block';
    ok.style.display = 'none';
  }

  if (!token) {
    showErr('This reset link is invalid or has expired. Request a new one from the forgot-password page.');
    form.querySelectorAll('input, button').forEach(el => { el.disabled = true; });
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.style.display = 'none';
    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirm').value;
    if (password.length < 8) {
      showErr('Password must be at least 8 characters.');
      return;
    }
    if (password !== confirm) {
      showErr('Passwords do not match.');
      return;
    }
    btn.disabled = true; btn.textContent = 'Saving…';
    try {
      const res = await fetch('/api/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, password }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Could not reset your password. Request a new reset link and try again.');
      err.style.display = 'none';
      ok.innerHTML = 'Your password has been reset. <a href="/app">Log in with your new password →</a>';
      ok.style.display = 'block';
      form.querySelectorAll('input').forEach(el => { el.disabled = true; });
      btn.textContent = 'Password reset ✓';
    } catch (ex) {
      showErr(ex.message);
      btn.disabled = false; btn.textContent = 'Set new password';
    }
  });
</script>
</body>
</html>
